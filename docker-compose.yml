version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jengatips-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - jengatips-db-data:/var/lib/postgresql/data
    networks:
      - jengatips-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Secured Redis Engine Block
  redis:
    image: redis:7-alpine
    container_name: jengatips-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
    - jengatips-redis-data:/data
    networks:
      - jengatips-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express Backend Container API Instance
  backend:
    build: ./backend
    container_name: jengatips-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      DB_HOST: db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
        db:
          condition: service_healthy
        redis:
           condition: service_healthy
    networks:
        - jengatips-net
    expose:
        - "5000"
    volumes:
        - jengatips-uploads:/app/storage/upload

  # Next.js Frontend Container Instance
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: jengatips-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env.production
    depends_on:
      - backend
    networks:
      - jengatips-net
    expose:
      - "3000"

  # Nginx Core Routing / Reverse Proxy Layer
  nginx:
    image: nginx:alpine
    container_name: jengatips-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"
    volumes:
      - ./nginx/jengatips.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - jengatips-net

networks:
  jengatips-net:
     driver: bridge

volumes:
  jengatips-db-data:
  jengatips-redis-data:
  jengatips-uploads: