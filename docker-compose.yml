x-logging: &default-logging
  driver: json-file
  options:
    compress: "true"
    max-file: "3"
    max-size: "10m"

networks:
  app-net:
    driver: bridge
  data-net:
    driver: bridge
    internal: true
  public-net:
    driver: bridge

secrets:
  auth0_mgmt_client_secret:
    file: ./secrets/auth0_mgmt_client_secret.txt
  db_password:
    file: ./secrets/db_password.txt
  emalify_api_key:
    file: ./secrets/emalify_api_key.txt
  malipo_callback_secret_path:
    file: ./secrets/malipo_callback_secret_path.txt
  malipo_webhook_secret:
    file: ./secrets/malipo_webhook_secret.txt
  mpesa_callback_secret_path:
    file: ./secrets/mpesa_callback_secret_path.txt
  mpesa_consumer_key:
    file: ./secrets/mpesa_consumer_key.txt
  mpesa_consumer_secret:
    file: ./secrets/mpesa_consumer_secret.txt
  mpesa_passkey:
    file: ./secrets/mpesa_passkey.txt
  redis_password:
    file: ./secrets/redis_password.txt

services:
  backend:
    build: ./backend
    container_name: jengatips-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      AUTH0_MGMT_CLIENT_SECRET_FILE: /run/secrets/auth0_mgmt_client_secret
      DB_HOST: postgres
      DB_PASSWORD_FILE: /run/secrets/db_password
      EMALIFY_API_KEY_FILE: /run/secrets/emalify_api_key
      MALIPO_CALLBACK_SECRET_PATH_FILE: /run/secrets/malipo_callback_secret_path
      MALIPO_WEBHOOK_SECRET_FILE: /run/secrets/malipo_webhook_secret
      MPESA_CALLBACK_SECRET_PATH_FILE: /run/secrets/mpesa_callback_secret_path
      MPESA_CONSUMER_KEY_FILE: /run/secrets/mpesa_consumer_key
      MPESA_CONSUMER_SECRET_FILE: /run/secrets/mpesa_consumer_secret
      MPESA_PASSKEY_FILE: /run/secrets/mpesa_passkey
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      REDIS_PORT: "6379"
    expose:
      - "5000"
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 20s
      test: [ "CMD-SHELL", "node -e \"require('net').connect(5000, 'localhost').on('connect', function() { this.end(); process.exit(0); }).on('error', () => process.exit(1))\"" ]
      timeout: 5s
    logging: *default-logging
    networks:
      - app-net
      - data-net
    pre_start:
      - command: ["node", "src/db/migrate.js"]
    restart: unless-stopped
    secrets:
      - auth0_mgmt_client_secret
      - db_password
      - emalify_api_key
      - malipo_callback_secret_path
      - malipo_webhook_secret
      - mpesa_callback_secret_path
      - mpesa_consumer_key
      - mpesa_consumer_secret
      - mpesa_passkey
      - redis_password
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    volumes:
      - jengatips-uploads:/app/storage/uploads

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jengatips-frontend
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - ./frontend/.env
    environment:
      BACKEND_INTERNAL_URL: http://backend:5000
      NODE_ENV: production
    expose:
      - "3000"
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 20s
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/', r => process.exit(0)).on('error', () => process.exit(1))\""]
      timeout: 5s
    logging: *default-logging
    networks:
      - app-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  nginx:
    container_name: jengatips-nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    image: nginx:alpine
    logging: *default-logging
    networks:
      - app-net
      - public-net
    ports:
      - "8085:80"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    volumes:
      - ./nginx/jengatips.conf:/etc/nginx/conf.d/default.conf:ro

  postgres:
    container_name: jengatips-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_USER: ${DB_USER}
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 15s
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      timeout: 5s
    image: postgres:16-alpine
    logging: *default-logging
    networks:
      - data-net
    restart: unless-stopped
    secrets:
      - db_password
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    volumes:
      - jengatips-db-data:/var/lib/postgresql/data

  redis:
    command: sh -c 'redis-server --requirepass "$$(cat /run/secrets/redis_password)"'
    container_name: jengatips-redis
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 10s
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" --no-auth-warning ping | grep -q PONG"]
      timeout: 5s
    image: redis:7-alpine
    logging: *default-logging
    networks:
      - data-net
    restart: unless-stopped
    secrets:
      - redis_password
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    volumes:
      - jengatips-redis-data:/data

volumes:
  jengatips-db-data:
  jengatips-redis-data:
  jengatips-uploads: